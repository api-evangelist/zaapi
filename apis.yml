aid: zaapi
name: Zaapi
description: 'Zaapi is an all-in-one conversational AI and chat-commerce platform built for
  Southeast Asia''s micro, small, and medium-sized e-commerce sellers. Founded in 2021 by Wilfried
  Buiron and launched in Thailand, Zaapi unifies customer conversations from Facebook, Instagram,
  LINE, WhatsApp, TikTok Shop, Shopee, Lazada, email, and a seller''s own website into a single
  shared inbox, then layers AI agents, automations, broadcast campaigns, and analytics on top to
  turn those channels into revenue. It is backed by Partech, Global Founders Capital, and Flourish
  Ventures. As of this profile Zaapi exposes no public developer API, OpenAPI specification, SDK, or
  developer portal; webhook connectivity was signalled on the product roadmap but is not yet published.'
